server:
  # The reverse proxy on this host is the only public listener.
  listen: 127.0.0.1:8787
  public_url: https://relay.example.com
  trusted_proxies:
    - 127.0.0.1/32
    - ::1/128

database:
  path: /var/lib/codex-relay/relay.sqlite

security:
  control_token_env: CODEX_RELAY_CONTROL_TOKEN
  allow_insecure_http: false
  allow_registration: false
  legacy_api_enabled: true
  account_session_ttl: 720h
  device_claim_ttl: 5m
  allowed_origins: []

logging:
  level: info
  format: json
