server:
  listen: 0.0.0.0:8787
  public_url: https://relay.example.com
  trusted_proxies:
    - 172.16.0.0/12

database:
  path: /var/lib/codex-relay/relay.sqlite

security:
  control_token_env: CODEX_RELAY_CONTROL_TOKEN
  # The published Docker port is bound to host loopback and HTTPS terminates
  # at the host reverse proxy.
  allow_insecure_http: true
  allowed_origins: []

logging:
  level: info
  format: json
